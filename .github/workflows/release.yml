name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm pack
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          if (process.env.GITHUB_REF_NAME !== `v${version}`) throw Error('Tag/package version mismatch');
          const section = readFileSync('CHANGELOG.md', 'utf8').split(/^## /m)
            .find(text => text.startsWith(`[${version}]`));
          if (!section) throw Error('Missing changelog section');
          writeFileSync(join(process.env.RUNNER_TEMP, 'release-notes.md'), '## ' + section);
          NODE
          gh release create "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/release-notes.md" --generate-notes ./*.tgz
